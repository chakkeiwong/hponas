name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_mutation_campaign:
        description: 'Run an independently allocated full mutation campaign'
        type: boolean
        default: false
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,test,ray,tpe,cmaes,validation]'
      - run: python -m compileall -q hponas workloads validation tools examples
      - run: ruff check hponas workloads validation tools
      - run: python -m pytest tests -m 'not slow' --ignore=tests/scale -q
      - run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Verify isolated wheel and maintained examples
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/hponas-wheel"
          "$RUNNER_TEMP/hponas-wheel/bin/python" -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/hponas-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/hponas-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hponas-wheel/bin/python" -m tools.check_installed --output "$GITHUB_WORKSPACE/dist/installed-receipt.json"
          "$RUNNER_TEMP/hponas-wheel/bin/python" "$GITHUB_WORKSPACE/examples/spike_branin.py" --executor local
          "$RUNNER_TEMP/hponas-wheel/bin/python" "$GITHUB_WORKSPACE/examples/spike_crash_recovery.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-${{ matrix.python-version }}
          path: dist/*.whl
  mutation-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mutation_campaign
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,ray,tpe,cmaes,validation]'
      - run: python -m validation.run_validation_with_audit V03 --run-mutations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-evidence
          path: validation/artifacts/V03
