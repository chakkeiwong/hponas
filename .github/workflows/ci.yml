name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"

    - name: Lint with ruff
      run: |
        ruff check hponas/

    - name: Format check with black
      run: |
        black --check hponas/ tests/

    - name: Type check with mypy
      run: |
        mypy hponas/
      continue-on-error: true  # Don't fail on type errors during Tier 0

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=hponas --cov-report=xml --cov-report=term

    - name: Run conformance tests
      run: |
        pytest tests/conformance/ -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run mutation tests
      run: |
        mutmut run --paths-to-mutate hponas/ || true
        mutmut results
        mutmut junitxml > mutation-results.xml
      continue-on-error: true  # Don't fail CI on mutation score during early development

    - name: Upload mutation results
      uses: actions/upload-artifact@v3
      with:
        name: mutation-results
        path: mutation-results.xml

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v
