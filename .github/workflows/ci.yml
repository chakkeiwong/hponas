name: CI

# R1 spike CI: lint, type check, tests, and the two spike examples as smoketests.
# Survey reference: R1 spike charter, deliverable 5 (package infrastructure).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check hponas tests examples

      - name: Mypy
        run: mypy hponas

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest -v

      - name: Upload coverage HTML
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7

  smoketest:
    name: Spike examples
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # R1 exit criterion: one real study runs end to end on both executors,
      # with the same seed producing the same result.
      - name: Branin study and determinism check
        timeout-minutes: 5
        run: python examples/spike_branin.py

      # R1 exit criterion: coordinator crash and resume without duplicate observations.
      - name: Crash recovery demonstration
        timeout-minutes: 5
        run: python examples/spike_crash_recovery.py

  clean-install:
    name: Clean install from lock
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the gating target; macOS is nice-to-have per the spike charter.
        os: [ubuntu-latest, macos-latest]
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda from environment.yml
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: hponas-spike
          auto-activate-base: false
          miniforge-version: latest

      - name: Install package into the locked environment
        shell: bash -el {0}
        run: pip install -e .

      - name: Import and version check
        shell: bash -el {0}
        run: python -c "import hponas; print('hponas', hponas.__version__)"

      - name: Tests in the locked environment
        shell: bash -el {0}
        run: pytest -q
