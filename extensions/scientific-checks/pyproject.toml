[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hponas-scientific-checks"
version = "0.1.0"
description = "Optional finite scientific verification tools for HPO-NAS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "mpmath>=1.3,<1.4"]
license = "MIT"

[project.scripts]
hponas-scientific-checks = "hponas_scientific_checks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hponas_scientific_checks*"]

[tool.setuptools.package-data]
hponas_scientific_checks = ["MATHEMATICS.md"]
