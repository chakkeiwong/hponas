[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hponas"
version = "0.1.0"
description = "HPO with moderate architecture search: the corrected BUILD_PROGRAM executable spike"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "HPO Survey Team"}
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sqlalchemy>=2.0",
    "ray[default]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.1",
]
tier0 = [
    "torch>=2.1",
    "gpytorch>=1.11",
    "botorch>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hponas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=hponas --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# scipy ships no type stubs (scipy-stubs is third-party and partial). Sobol is the only
# surface we touch, and it is wrapped in hponas/searchers.py.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# numpy's bundled stubs use 3.12+ syntax, which mypy cannot parse under python_version
# 3.10. Skip following them rather than raising the floor for the package itself.
[[tool.mypy.overrides]]
module = ["numpy"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C90"]
ignore = ["E501"]
