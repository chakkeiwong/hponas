[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hponas"
version = "0.1.0"
description = "Hyperparameter and Neural Architecture Search"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "HPO-NAS Team"},
]
keywords = ["hyperparameter optimization", "neural architecture search", "bayesian optimization", "automl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "botorch>=0.9.0,<1.0.0",
    "gpytorch>=1.11.0,<2.0.0",
    "torch>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0.0",
    "mutmut>=3.0.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mutmut]
paths = [
    "hponas/searchers/",
    "hponas/executors/",
    "hponas/legacy_searchers.py",
    "hponas/legacy_executors.py",
    "hponas/schedulers.py",
    "hponas/space.py",
    "hponas/types.py",
]
pytest_add_cli_args = [
    "--ignore=tests/unit",
    "--ignore=tests/test_cost_efficiency.py",
    "--ignore=tests/test_prior_recovery_pibo.py",
    "--ignore=tests/test_prior_recovery_priorband.py",
    "--ignore=tests/test_verify_manifest.py",
    "--ignore=tests/scale/test_distributed.py",
    "--ignore=tests/property/test_invariants.py",
]
debug = true
