[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hponas"
version = "0.1.0"
description = "Hyperparameter and Neural Architecture Search"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "HPO-NAS Team"},
]
keywords = ["hyperparameter optimization", "neural architecture search", "bayesian optimization", "automl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "botorch>=0.9.0,<1.0.0",
    "gpytorch>=1.11.0,<2.0.0",
    "torch>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.82.0",
    "mutmut>=2.4.0",
]

workloads = [
    "jax[cpu]>=0.4.0,<1.0.0",
    "brax>=0.9.0,<1.0.0",
    "optax>=0.1.7,<1.0.0",
]

ray = [
    "ray[default]>=2.6.0,<3.0.0",
]

all = [
    "hponas[dev,test,workloads,ray]",
]

[project.urls]
Homepage = "https://github.com/hponas/hponas"
Documentation = "https://hponas.readthedocs.io"
Repository = "https://github.com/hponas/hponas"
"Bug Tracker" = "https://github.com/hponas/hponas/issues"

[tool.setuptools]
packages = ["hponas"]

[tool.setuptools.package-data]
hponas = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=hponas",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests (< 1s each)",
    "conformance: contract conformance tests",
    "integration: integration tests (slower)",
    "validation: statistical validation campaigns (very slow)",
    "slow: marks tests as slow (> 10s)",
    "gpu: requires GPU",
]

[tool.coverage.run]
source = ["hponas"]
omit = [
    "tests/*",
    "hponas/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (let developers decide)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
"tests/*" = ["B011"]      # assert False in tests

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "pandas.*",
    "sklearn.*",
    "botorch.*",
    "gpytorch.*",
    "jax.*",
    "brax.*",
    "ray.*",
]
ignore_missing_imports = true

[tool.mutmut]
paths_to_mutate = "hponas/"
backup = false
runner = "pytest -x tests/unit/"
tests_dir = "tests/unit/"
